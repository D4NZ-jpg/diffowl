name: Review OWL request

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: read
  issues: write

jobs:
  route:
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/diffowl ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: D4NZ-jpg/diffowl/review-request@main
        with:
          workflow: review-owl.yml
        env:
          GITHUB_TOKEN: ${{ github.token }}
