name: Review OWL
description: Classify pull-request trust and run the self-hostable Diffowl Review engine.
inputs:
  self-hosted-state-directory:
    description: A trusted durable filesystem directory required for explicit self-hosted Action runs. GitHub-hosted runs always use the base repository Git state ref and ignore filesystem state.
    required: false
  repository:
    description: The base repository for an authenticated Review request workflow dispatch.
    required: false
  pull-request-number:
    description: The pull-request number for an authenticated Review request workflow dispatch.
    required: false
  base-sha:
    description: The verified base revision for an authenticated Review request workflow dispatch.
    required: false
  head-sha:
    description: The verified head revision for an authenticated Review request workflow dispatch.
    required: false
  head-repository:
    description: The verified head repository for an authenticated Review request workflow dispatch. Equals the base repository unless policy admits a collaborator fork.
    required: false
  review-request-event-id:
    description: The durable command event identity authorizing a Review or Finding discussion workflow dispatch.
    required: false
  command-work-type:
    description: The durable command route selected by the trusted default-branch router.
    required: false
  finding-fingerprint:
    description: The stable Finding identity for bounded Finding discussion work.
    required: false
  finding-context:
    description: Author-supplied product or technical context for bounded reassessment.
    required: false
  finding-root-comment-id:
    description: The stable root review-comment identity for the Finding discussion.
    required: false
outputs:
  outcome:
    description: The typed Review outcome as JSON.
  run-id:
    description: The persisted Review run identifier, when durable state is configured.
  run-metadata:
    description: Safe persisted Review run metadata as JSON, when durable state is configured.
  publication:
    description: Adapter-owned GitHub publication result and receipts as JSON.
runs:
  using: node24
  main: dist/action/index.js
