name: Review OWL

# Request-only: nothing runs on pull_request events. Comment `/diffowl review`
# on a pull request; review-request.yml verifies the actor and dispatches
# this workflow at the verified head revision.
on:
  workflow_dispatch:
    inputs:
      repository:
        required: true
        type: string
      pull-request-number:
        required: true
        type: string
      base-sha:
        required: true
        type: string
      head-sha:
        required: true
        type: string
      head-repository:
        required: false
        type: string
      review-request-event-id:
        required: true
        type: string
      command-work-type:
        required: false
        type: string
      finding-fingerprint:
        required: false
        type: string
      finding-context:
        required: false
        type: string
      finding-root-comment-id:
        required: false
        type: string

concurrency:
  group: review-owl-${{ inputs.pull-request-number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The router verified head-repository against the live pull request;
          # it equals this repository unless policy admitted a collaborator fork.
          repository: ${{ inputs.head-repository || github.repository }}
          ref: ${{ inputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false
      # No dependency install or other steps here: anything that runs the
      # pull request's own scripts belongs in .diffowl.json validationCommands,
      # where it executes under the engine's scrubbed environment. This job
      # carries exactly one secret, the provider key.
      - id: review-owl
        uses: D4NZ-jpg/diffowl@v0
        with:
          repository: ${{ inputs.repository }}
          pull-request-number: ${{ inputs.pull-request-number }}
          base-sha: ${{ inputs.base-sha }}
          head-sha: ${{ inputs.head-sha }}
          head-repository: ${{ inputs.head-repository }}
          review-request-event-id: ${{ inputs.review-request-event-id }}
          command-work-type: ${{ inputs.command-work-type }}
          finding-fingerprint: ${{ inputs.finding-fingerprint }}
          finding-context: ${{ inputs.finding-context }}
          finding-root-comment-id: ${{ inputs.finding-root-comment-id }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Shared credential store (Supabase Postgres). The Action consumes these
          # three variables before any role or validation command runs; the row
          # holds the provider OAuth blob and is refreshed under a row lock.
          DIFFOWL_CREDENTIAL_STORE_URL: ${{ secrets.DIFFOWL_CREDENTIAL_STORE_URL }}
          DIFFOWL_CREDENTIAL_STORE_KEY: diffowl-default
          DIFFOWL_CREDENTIAL_STORE_SECRET: ${{ secrets.DIFFOWL_CREDENTIAL_STORE_SECRET }}
